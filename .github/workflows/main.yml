name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --uac-admin --name=svchost_update --icon=icon.ico Ram.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: svchost_update-exe
          path: dist/svchost_update.exe
